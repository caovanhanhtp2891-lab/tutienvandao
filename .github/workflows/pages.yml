name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify JavaScript and game logic
        run: |
          node --check dist/game.js
          node --check dist/app.js
          node --check dist/journey.js
          node --check dist/adventure-app.js
          npm test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the playable game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
