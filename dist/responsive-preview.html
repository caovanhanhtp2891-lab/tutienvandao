<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tu Tiên Vấn Đạo — Kiểm tra bế quan v2.2</title><style>*{box-sizing:border-box}body{margin:0;background:#071c16;color:#e3e3cc;font:13px system-ui;padding:20px}h1{font:500 24px Georgia;margin:0 0 8px}p{font-size:11px;color:#a0b89f;margin:0 0 15px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}nav a{padding:8px 12px;background:#214631;border:1px solid #d7c59140;border-radius:5px;color:#d4c491;text-decoration:none;font-size:11px}main{display:flex;gap:20px;align-items:start;flex-wrap:wrap}.label{font-size:10px;color:#d7c591;margin-bottom:8px;letter-spacing:1px}.desktop-shell{width:794px;height:497px}.desktop-shell iframe{width:1440px;height:900px;transform:scale(.55);transform-origin:top left}.mobile-shell{width:392px;height:846px}.mobile-shell iframe{width:390px;height:844px}.small{width:322px;height:570px}.small iframe{width:320px;height:568px}.landscape-shell{width:677px;height:314px}.landscape-shell iframe{width:844px;height:390px;transform:scale(.8);transform-origin:top left}.frame{border:1px solid #bdc79755;border-radius:10px;overflow:hidden;box-shadow:0 10px 40px #030f07aa}iframe{display:block;border:0}.note{margin-top:20px}a{color:#d9c58e}</style></head><body><h1>Tu Tiên Vấn Đạo · v2.2</h1><p>Bốn viewport thật, các chức năng mở riêng. Những bản xem này không ghi hoặc thay thế tiến trình của người chơi.</p><nav><a href="?scenario=mortal&v=2.2.0">Phàm nhân</a><a href="?scenario=member&v=2.2.0">Đệ tử</a><a href="?scenario=elite&v=2.2.0">Nguyên Anh</a><a href="?scenario=founder&v=2.2.0">Tông chủ</a><a href="?scenario=breakthrough&v=2.2.0">Đột phá</a></nav><label style="display:block;margin:0 0 18px;font-size:11px;color:#d7c591">Cảnh giới thử: <select id="realm-select" style="margin-left:8px;background:#193b2a;border:1px solid #d7c59144;border-radius:4px;color:#d7c591;padding:6px"><option value="">Theo hành trình</option><option value="0">Phàm nhân</option><option value="1">Luyện Khí</option><option value="2">Trúc Cơ</option><option value="3">Kim Đan</option><option value="4">Nguyên Anh</option><option value="5">Hóa Thần</option><option value="6">Luyện Hư</option><option value="7">Hợp Thể</option><option value="8">Đại Thừa</option><option value="9">Độ Kiếp</option></select></label><main><section><div class="label">PC · 1440 × 900</div><div class="frame desktop-shell"><iframe id="desktop" title="Game trên PC"></iframe></div></section><section><div class="label">ĐIỆN THOẠI · 390 × 844</div><div class="frame mobile-shell"><iframe id="mobile" title="Game trên điện thoại"></iframe></div></section><section><div class="label">ĐIỆN THOẠI NHỎ · 320 × 568</div><div class="frame mobile-shell small"><iframe id="small-mobile" title="Game trên điện thoại nhỏ"></iframe></div></section><section><div class="label">ĐIỆN THOẠI NGANG · 844 × 390</div><div class="frame landscape-shell"><iframe id="landscape" title="Game trên điện thoại ngang"></iframe></div></section></main><p class="note"><a href="index.html">Mở game và lưu tiến trình</a></p><script>const q=new URLSearchParams(location.search),scenario=['mortal','member','elite','founder','breakthrough'].includes(q.get('scenario'))?q.get('scenario'):'mortal';document.querySelectorAll('iframe').forEach(f=>f.src='index.html?preview=1&scenario='+scenario+'&v=2.2.0'+(q.has('realm')?'&realm='+encodeURIComponent(q.get('realm')):''));document.getElementById('realm-select').value=q.get('realm')||'';document.getElementById('realm-select').addEventListener('change',e=>{const next=new URLSearchParams(location.search);if(e.target.value==='')next.delete('realm');else{next.set('realm',e.target.value);next.set('scenario','member');}next.set('v','2.2.0');location.search=next.toString();});</script></body></html>
